<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Nhỏ Cảm Ơn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nhúng video YouTube phát tự động (autoplay=1) và lặp lại (loop=1) -->
    <iframe id="bg-music" 
            src="https://www.youtube.com/embed/lxGP-d4rZpE?enablejsapi=1&autoplay=1&mute=0&loop=1&playlist=lxGP-d4rZpE" 
            allow="autoplay" 
            style="display:none;">
    </iframe>

    <div class="container">
        <h1>Cảm Ơn Người Đã Thức Cùng Tôi</h1>
        <p class="subtitle">Bấm vào nút để mở thông điệp dành riêng cho bạn</p>
        
        <!-- Nút bấm 1 lần -->
        <button id="action-btn" class="main-btn">Khám phá ngay</button>

        <!-- Khung nội dung xuất hiện khi bấm -->
        <div id="message-box" class="hidden">
            <p class="message-text">"Cảm ơn đôi tay dù nhiều vết thương còn đợi ôm tôi cuối đường..."</p>
        </div>
    </div>

    <!-- Container cho hiệu ứng cánh hoa rơi -->
    <div id="falling-container"></div>

    <script src="script.js"></script>
</body>
</html>

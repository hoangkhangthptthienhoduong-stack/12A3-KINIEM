<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12A3 - Kỷ Niệm Thanh Xuân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LỜI NHẮN NHỦ 12A3 - HAI NĂM NHÌN LẠI</h1>
            <p class="subtitle">Trọn vẹn tình cảm gửi đến Cô Võ Thị Thanh Truyền và 31 thành viên</p>
        </header>

        <div class="player-box">
            <div class="player-info">
                <span class="music-icon">🎵</span>
                <div>
                    <strong>Nhạc nền hoài niệm:</strong> Bụi Phấn (Piano Version)
                </div>
            </div>
            <audio id="bg-music" controls loop preload="auto">
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=piano-moment-114823.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ phát âm thanh.
            </audio>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tên người nhận...">
        </div>

        <div id="cards-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
